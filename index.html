<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>नेपाली कानुनी सहायक</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #003893;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 { font-size: 20px; }
    .header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user {
      background: #003893;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .assistant {
      background: #f0f2f5;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .typing {
      background: #f0f2f5;
      color: #999;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      font-style: italic;
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
    }

    input:focus { border-color: #003893; }

    button {
      background: #003893;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover { background: #002570; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
  <h1>⚖️ नेपाली कानुनी सहायक</h1>
  <p>कानुनी प्रश्नहरू सोध्नुहोस् — नेपाली वा अंग्रेजीमा</p>
</div>

<div style="background: #fff3cd; color: #856404; padding: 10px 20px; font-size: 12px; text-align: center;">
  ⚠️ यो सामान्य कानुनी जानकारी मात्र हो — पेशेवर कानुनी सल्लाह होइन। जटिल मुद्दाहरूमा योग्य वकिलसँग परामर्श गर्नुहोस्।
</div>

    <div class="messages" id="messages">
      <div class="message assistant">
        नमस्ते! म तपाईंको कानुनी सहायक हुँ। तपाईंको कानुनी प्रश्नहरू सोध्नुहोस् — नेपाली वा अंग्रेजीमा। 🙏
      </div>
    </div>

    <div class="input-area">
      <input 
        type="text" 
        id="userInput" 
        placeholder="आफ्नो प्रश्न यहाँ लेख्नुहोस्..."
        onkeypress="if(event.key==='Enter') sendMessage()"
      />
      <button onclick="sendMessage()">पठाउनुहोस्</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const messages = document.getElementById("messages");
      const text = input.value.trim();
      if (!text) return;

      // Show user message
      messages.innerHTML += `<div class="message user">${text}</div>`;
      input.value = "";

      // Show typing indicator
      messages.innerHTML += `<div class="message typing" id="typing">सहायक लेख्दैछ...</div>`;
      messages.scrollTop = messages.scrollHeight;

      // Send to server
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();

      // Remove typing indicator and show response
      document.getElementById("typing").remove();
      const formatted = data.response
  .replace(/#{1,3} (.+)/g, '<br><br><strong>$1</strong><br>')
  .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  .replace(/- (.+)/g, '<br>• $1')
  .replace(/\n/g, '<br>');
messages.innerHTML += `<div class="message assistant">${formatted}</div>`;
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
